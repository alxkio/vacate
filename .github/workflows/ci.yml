name: CI
on:
  pull_request:
  workflow_call:
    inputs:
      skip_backend:
        description: Skip API build/tests/package when a caller deploys only the frontend
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Manual deployment callers use their own run ID and cannot cancel each other.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  backend:
    if: ${{ !inputs.skip_backend }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify API target matches Functions runtime
        shell: bash
        run: |
          set -euo pipefail
          api_framework=$(sed -n 's/.*<TargetFramework>net\([^<]*\)<\/TargetFramework>.*/\1/p' api/Directory.Build.props)
          functions_runtime=$(sed -n "s/.*runtime: { name: 'dotnet-isolated', version: '\([^']*\)' }.*/\1/p" infra/modules/functions-backend.bicep)
          if [[ -z "$api_framework" || "$api_framework" != "$functions_runtime" ]]; then
            echo "API target net${api_framework:-<missing>} does not match Functions runtime ${functions_runtime:-<missing>}" >&2
            exit 1
          fi
      - run: dotnet restore api/Vacate.slnx --locked-mode
      - run: dotnet build api/Vacate.slnx --configuration Release --no-restore
      - run: dotnet test api/Vacate.slnx --configuration Release --no-build --no-restore
      - name: Package database operator and review SQL
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish api/tools/Vacate.Database --configuration Release --no-restore --output artifacts/database -p:SourceRevisionId="$GITHUB_SHA"
          dotnet artifacts/database/Vacate.Database.dll script > artifacts/database/migrations.sql
          printf '%s\n' "$GITHUB_SHA" > artifacts/database/revision.txt
          python3 scripts/test_database_deployment.py
      - uses: actions/upload-artifact@v7
        with:
          name: database-package
          path: artifacts/database
          if-no-files-found: error
      - name: Publish Functions package
        run: dotnet publish api/src/Vacate.Api --configuration Release --no-restore --output artifacts/api -p:SourceRevisionId="$GITHUB_SHA"
      - name: Verify package and run Functions host from source
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/api/host.json
          test -f artifacts/api/worker.config.json
          test -f artifacts/api/.azurefunctions/function.deps.json
          jq -e '.description.language == "dotnet-isolated" and .description.workerIndexing == "true"' artifacts/api/worker.config.json
          if find artifacts/api -name 'local.settings*.json' -o -name 'appsettings*.json' | grep -q .; then
            echo 'Local configuration must not be published' >&2
            exit 1
          fi
          npm install --global azure-functions-core-tools@4.16.0
          (cd api/src/Vacate.Api && FUNCTIONS_WORKER_RUNTIME=dotnet-isolated AzureWebJobsStorage='' dotnet run --configuration Release --no-build -- --port 7071 > "$RUNNER_TEMP/functions.log" 2>&1) &
          host_pid=$!
          trap 'kill "$host_pid" 2>/dev/null || true' EXIT
          python3 scripts/cloud-smoke.py --api-base-url http://localhost:7071/api --revision "$GITHUB_SHA"
      - name: Host diagnostics
        if: failure()
        run: cat "$RUNNER_TEMP/functions.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: functions-package
          path: artifacts/api
          include-hidden-files: true
          if-no-files-found: error
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check TypeScript project output configuration
        run: |
          node node_modules/typescript/bin/tsc --project tsconfig.app.json
          node node_modules/typescript/bin/tsc --project tsconfig.spec.json
      - run: npm run build -- --configuration production
      - run: npm test -- --watch=false
      - name: Verify frontend fixtures and prepare Angular output
        shell: bash
        run: |
          set -euo pipefail
          for file in src/app/core/reference-data/*.js testing/fixtures/*.js; do node --check "$file"; done
          node verify-fixtures.mjs
          node verify-eligibility-contract.mjs
          node verify-api-contract.mjs
          node verify-profiles.mjs
          node verify-organization.mjs
          python3 ../scripts/test_cloud_smoke.py
          python3 ../scripts/prepare-frontend.py --frontend-output dist/vacate-web/browser --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: angular-production
          path: frontend/dist/vacate-web/browser
          if-no-files-found: error

  api-web:
    if: ${{ !inputs.skip_backend }}
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v8
        with:
          name: angular-production
          path: frontend/dist/vacate-web/browser
      - run: dotnet restore api/src/Vacate.Api/Vacate.Api.csproj --locked-mode
      - name: Verify real API and Angular together
        shell: bash
        run: |
          set -euo pipefail
          npm install --global azure-functions-core-tools@4.16.0
          (cd api/src/Vacate.Api && DevelopmentAuthentication__Enabled=true SeedData__Enabled=true FUNCTIONS_WORKER_RUNTIME=dotnet-isolated AzureWebJobsStorage='' dotnet run --configuration Release --no-restore -- --port 7071 > "$RUNNER_TEMP/functions-paired.log" 2>&1) &
          host_pid=$!
          trap 'kill "$host_pid" 2>/dev/null || true' EXIT
          python3 scripts/verify-api.py
          npm ci --prefix frontend
          API_CONTRACT_URL=http://127.0.0.1:7071/api node frontend/verify-api-contract.mjs
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          export MOCK_SCREENSHOT_DIR="$RUNNER_TEMP/vacate-api-browser-previews"
          node frontend/verify.mjs
          python3 scripts/verify-leave-requests.py
      - name: Paired host diagnostics
        if: failure()
        run: cat "$RUNNER_TEMP/functions-paired.log" 2>/dev/null || true
      - name: Native input failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-input-failure
          path: |
            ${{ runner.temp }}/vacate-api-browser-previews/native-input-failure.json
            ${{ runner.temp }}/vacate-api-browser-previews/native-input-failure.png
          if-no-files-found: ignore
