name: Deploy Azure

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/azure-infrastructure.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Bicep environment configuration
        type: choice
        options: [dev, staging, prod]
        default: dev
      apply:
        description: Apply after validation and what-if (false previews only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Compile all environment configurations
        shell: bash
        run: |
          set -euo pipefail
          az bicep install
          az bicep build --file infra/main.bicep
          for environment in dev staging prod; do
            az bicep build-params --file "infra/parameters/${environment}.bicepparam"
          done

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: [compile, checks]
    runs-on: ubuntu-24.04
    concurrency:
      group: azure-infrastructure-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - name: Check deployment target
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          subscription = os.environ.get('AZURE_SUBSCRIPTION_ID', '')
          resource_group = os.environ.get('AZURE_RESOURCE_GROUP', '')
          target_file = Path('infra/targets') / (os.environ['DEPLOY_ENVIRONMENT'] + '.json')
          if target_file.exists():
              target = json.loads(target_file.read_text())
              if (subscription and subscription != target['subscriptionId']) or (resource_group and resource_group != target['resourceGroup']):
                  raise SystemExit('Repository target variables conflict with the checked-in deployment target')
              subscription = target['subscriptionId']
              resource_group = target['resourceGroup']
          if not all(isinstance(value, str) and value and '\n' not in value and '\r' not in value for value in [subscription, resource_group]):
              raise SystemExit('Configure subscription and resource group in infra/targets or repository variables')
          try:
              credential = json.loads(os.environ.get('AZURE_CREDENTIALS', ''))
          except ValueError:
              raise SystemExit('Set the AZURE_CREDENTIALS repository secret to valid credential JSON')
          if not isinstance(credential, dict) or credential.get('subscriptionId') != subscription or not all(isinstance(credential.get(key), str) and credential[key] for key in ['clientId', 'clientSecret', 'tenantId']):
              raise SystemExit('AZURE_CREDENTIALS must contain clientId, clientSecret, tenantId and the designated subscriptionId')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'AZURE_SUBSCRIPTION_ID={subscription}\nAZURE_RESOURCE_GROUP={resource_group}\n')
      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Validate and preview
        shell: bash
        run: |
          set -euo pipefail
          az bicep install
          az group show --subscription "$AZURE_SUBSCRIPTION_ID" --name "$AZURE_RESOURCE_GROUP" --output none
          az deployment group validate --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$AZURE_RESOURCE_GROUP" --parameters "infra/parameters/${DEPLOY_ENVIRONMENT}.bicepparam" --output none
          az deployment group what-if --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$AZURE_RESOURCE_GROUP" --parameters "infra/parameters/${DEPLOY_ENVIRONMENT}.bicepparam"
      - name: Deploy infrastructure
        id: infrastructure
        if: inputs.apply
        shell: bash
        run: |
          set -euo pipefail
          az deployment group create --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$AZURE_RESOURCE_GROUP" --name "vacate-${DEPLOY_ENVIRONMENT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --parameters "infra/parameters/${DEPLOY_ENVIRONMENT}.bicepparam" --output json > "$RUNNER_TEMP/deployment.json"
          jq '.properties.outputs' "$RUNNER_TEMP/deployment.json"
          echo "function_name=$(jq -r '.properties.outputs.functionAppName.value' "$RUNNER_TEMP/deployment.json")" >> "$GITHUB_OUTPUT"
          echo "function_url=$(jq -r '.properties.outputs.functionAppUrl.value' "$RUNNER_TEMP/deployment.json")" >> "$GITHUB_OUTPUT"
          echo "web_name=$(jq -r '.properties.outputs.staticSiteName.value' "$RUNNER_TEMP/deployment.json")" >> "$GITHUB_OUTPUT"
          echo "web_url=$(jq -r '.properties.outputs.staticSiteUrl.value' "$RUNNER_TEMP/deployment.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        if: inputs.apply
        with:
          name: functions-package
          path: artifacts/api
      - uses: actions/download-artifact@v8
        if: inputs.apply
        with:
          name: angular-production
          path: artifacts/web
      - name: Configure frontend for this deployment
        if: inputs.apply
        env:
          API_URL: ${{ steps.infrastructure.outputs.function_url }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg apiBaseUrl "$API_URL/api" --arg revision "$GITHUB_SHA" '{apiBaseUrl: $apiBaseUrl, revision: $revision}' > artifacts/web/config.json
          test -f artifacts/web/staticwebapp.config.json
      - name: Publish API
        if: inputs.apply
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.infrastructure.outputs.function_name }}
          package: artifacts/api
          remote-build: false
      - name: Retrieve frontend deployment token
        id: swa
        if: inputs.apply
        env:
          STATIC_SITE_NAME: ${{ steps.infrastructure.outputs.web_name }}
          SWA_DEPLOYMENT_TOKEN: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          token="$SWA_DEPLOYMENT_TOKEN"
          if [[ -z "$token" ]]; then
            token=$(az staticwebapp secrets list --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$AZURE_RESOURCE_GROUP" --name "$STATIC_SITE_NAME" --query properties.apiKey --output tsv)
          fi
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Publish Angular
        if: inputs.apply
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: artifacts/web
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: ${{ github.ref_name }}
      - name: Verify deployed endpoints
        if: inputs.apply
        env:
          API_URL: ${{ steps.infrastructure.outputs.function_url }}
          WEB_URL: ${{ steps.infrastructure.outputs.web_url }}
        run: python3 scripts/cloud-smoke.py --api-base-url "$API_URL/api" --web-base-url "$WEB_URL" --revision "$GITHUB_SHA"
      - name: Deployment summary
        if: inputs.apply
        env:
          API_URL: ${{ steps.infrastructure.outputs.function_url }}
          WEB_URL: ${{ steps.infrastructure.outputs.web_url }}
        run: |
          printf 'Deployed `%s` to `%s`\n\nWeb: %s\n\nDemo login: %s/login.html\n\nAPI health: %s/api/health\n' "$GITHUB_SHA" "$DEPLOY_ENVIRONMENT" "$WEB_URL" "$WEB_URL" "$API_URL" >> "$GITHUB_STEP_SUMMARY"
