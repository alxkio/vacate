name: Deploy Azure

on:
  pull_request:
    paths:
      - "infra/**"
      - "scripts/verify-sql-free-template.py"
      - "scripts/verify-functions-template.py"
      - ".github/workflows/azure-infrastructure.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Bicep environment configuration
        type: choice
        options: [dev, staging, prod]
        default: dev
      apply:
        description: Apply after validation and what-if (false previews only)
        type: boolean
        default: false
      deploy_backend:
        description: Build, test and publish API (required for API-backed feature changes)
        type: boolean
        default: true
      import_demo_history:
        description: Explicitly import dated fictional history after a full dev SQL deployment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: azure-validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    if: github.event_name == 'workflow_dispatch' && inputs.apply
    uses: ./.github/workflows/ci.yml
    with:
      skip_backend: ${{ !inputs.deploy_backend }}

  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Compile all environment configurations
        shell: bash
        run: |
          set -euo pipefail
          az bicep install
          az bicep build --file infra/main.bicep
          python3 scripts/verify-functions-template.py infra/main.json
          az bicep build --file infra/deployments/sql-access.bicep --outfile "$RUNNER_TEMP/sql-runtime-firewall.json"
          az bicep build --file infra/deployments/sql.bicep --outfile "$RUNNER_TEMP/sql-free.json"
          az bicep lint --file infra/deployments/sql.bicep
          python3 scripts/verify-sql-free-template.py "$RUNNER_TEMP/sql-free.json"
          for environment in dev staging prod; do
            az bicep build-params --file "infra/parameters/${environment}.bicepparam"
          done

  deploy:
    # Preview permits skipped application checks; apply requires their success.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.compile.result == 'success' && (!inputs.apply || needs.checks.result == 'success') }}
    needs: [compile, checks]
    runs-on: ubuntu-24.04
    concurrency:
      group: azure-infrastructure-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - name: Reject unsupported demo import selection
        if: inputs.import_demo_history && (!inputs.apply || !inputs.deploy_backend || inputs.environment != 'dev')
        run: |
          echo 'Demo history import requires an applied full backend deployment to dev.' >&2
          exit 1
      - name: Check deployment target
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          subscription = os.environ.get('AZURE_SUBSCRIPTION_ID', '')
          resource_group = os.environ.get('AZURE_RESOURCE_GROUP', '')
          target_file = Path('infra/targets') / (os.environ['DEPLOY_ENVIRONMENT'] + '.json')
          if target_file.exists():
              target = json.loads(target_file.read_text())
              if (subscription and subscription != target['subscriptionId']) or (resource_group and resource_group != target['resourceGroup']):
                  raise SystemExit('Repository target variables conflict with the checked-in deployment target')
              subscription = target['subscriptionId']
              resource_group = target['resourceGroup']
          if not all(isinstance(value, str) and value and '\n' not in value and '\r' not in value for value in [subscription, resource_group]):
              raise SystemExit('Configure subscription and resource group in infra/targets or repository variables')
          try:
              credential = json.loads(os.environ.get('AZURE_CREDENTIALS', ''))
          except ValueError:
              raise SystemExit('Set the AZURE_CREDENTIALS repository secret to valid credential JSON')
          if not isinstance(credential, dict) or credential.get('subscriptionId') != subscription or not all(isinstance(credential.get(key), str) and credential[key] for key in ['clientId', 'clientSecret', 'tenantId']):
              raise SystemExit('AZURE_CREDENTIALS must contain clientId, clientSecret, tenantId and the designated subscriptionId')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'AZURE_SUBSCRIPTION_ID={subscription}\nAZURE_RESOURCE_GROUP={resource_group}\n')
      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Validate and preview
        shell: bash
        run: |
          set -euo pipefail
          az bicep install
          az group show --subscription "$AZURE_SUBSCRIPTION_ID" --name "$AZURE_RESOURCE_GROUP" --output none
          az deployment group validate --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$AZURE_RESOURCE_GROUP" --parameters "infra/parameters/${DEPLOY_ENVIRONMENT}.bicepparam" --output none
          az deployment group what-if --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$AZURE_RESOURCE_GROUP" --parameters "infra/parameters/${DEPLOY_ENVIRONMENT}.bicepparam"
      - name: Deploy infrastructure
        id: infrastructure
        if: inputs.apply
        shell: bash
        run: |
          set -euo pipefail
          az deployment group create --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$AZURE_RESOURCE_GROUP" --name "vacate-${DEPLOY_ENVIRONMENT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --parameters "infra/parameters/${DEPLOY_ENVIRONMENT}.bicepparam" --output json > "$RUNNER_TEMP/deployment.json"
          jq '.properties.outputs' "$RUNNER_TEMP/deployment.json"
          echo "function_name=$(jq -r '.properties.outputs.functionAppName.value' "$RUNNER_TEMP/deployment.json")" >> "$GITHUB_OUTPUT"
          echo "function_url=$(jq -r '.properties.outputs.functionAppUrl.value' "$RUNNER_TEMP/deployment.json")" >> "$GITHUB_OUTPUT"
          echo "web_name=$(jq -r '.properties.outputs.staticSiteName.value' "$RUNNER_TEMP/deployment.json")" >> "$GITHUB_OUTPUT"
          echo "web_url=$(jq -r '.properties.outputs.staticSiteUrl.value' "$RUNNER_TEMP/deployment.json")" >> "$GITHUB_OUTPUT"
          sql_enabled=$(jq -er '.properties.outputs.sqlPersistenceEnabled.value | if type == "boolean" then tostring else error("Missing SQL mode output") end' "$RUNNER_TEMP/deployment.json")
          echo "sql_enabled=$sql_enabled" >> "$GITHUB_OUTPUT"
          echo "sql_server=$(jq -r '.properties.outputs.sqlServerHostname.value' "$RUNNER_TEMP/deployment.json")" >> "$GITHUB_OUTPUT"
          echo "sql_database=$(jq -r '.properties.outputs.sqlTargetDatabaseName.value' "$RUNNER_TEMP/deployment.json")" >> "$GITHUB_OUTPUT"
          echo "runtime_name=$(jq -r '.properties.outputs.runtimeIdentityName.value' "$RUNNER_TEMP/deployment.json")" >> "$GITHUB_OUTPUT"
          echo "runtime_client_id=$(jq -r '.properties.outputs.runtimeClientId.value' "$RUNNER_TEMP/deployment.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v5
        if: inputs.apply && inputs.deploy_backend
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        if: inputs.apply && inputs.deploy_backend
        with:
          name: database-package
          path: artifacts/database
      - name: Deploy and verify database
        if: inputs.apply && inputs.deploy_backend && steps.infrastructure.outputs.sql_enabled == 'true'
        env:
          VACATE_SQL_CONNECTION: ${{ secrets[format('AZURE_SQL_MIGRATION_CONNECTION_{0}', inputs.environment)] }}
          VACATE_SQL_SERVER: ${{ steps.infrastructure.outputs.sql_server }}
          VACATE_SQL_DATABASE: ${{ steps.infrastructure.outputs.sql_database }}
          VACATE_DEPLOY_REVISION: ${{ github.sha }}
          RUNTIME_NAME: ${{ steps.infrastructure.outputs.runtime_name }}
          RUNTIME_CLIENT_ID: ${{ steps.infrastructure.outputs.runtime_client_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat artifacts/database/revision.txt)" = "$GITHUB_SHA"
          test -n "$VACATE_SQL_CONNECTION" || { echo 'Configure the environment-specific AZURE_SQL_MIGRATION_CONNECTION secret before deploying a SQL backend.' >&2; exit 1; }
          dotnet artifacts/database/Vacate.Database.dll deploy "$RUNTIME_NAME" "$RUNTIME_CLIENT_ID"
          printf 'Database migrations, runtime grants and mapped-column reads verified for `%s`.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v8
        if: inputs.apply && inputs.deploy_backend
        with:
          name: functions-package
          path: artifacts/api
      - uses: actions/download-artifact@v8
        if: inputs.apply
        with:
          name: angular-production
          path: artifacts/web
      - name: Configure frontend for this deployment
        if: inputs.apply
        env:
          API_URL: ${{ steps.infrastructure.outputs.function_url }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg apiBaseUrl "$API_URL/api" --arg revision "$GITHUB_SHA" '{apiBaseUrl: $apiBaseUrl, revision: $revision}' > artifacts/web/config.json
          test -f artifacts/web/staticwebapp.config.json
      - name: Publish API
        if: inputs.apply && inputs.deploy_backend
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.infrastructure.outputs.function_name }}
          package: artifacts/api
          remote-build: false
      - name: Retrieve frontend deployment token
        id: swa
        if: inputs.apply
        env:
          STATIC_SITE_NAME: ${{ steps.infrastructure.outputs.web_name }}
          SWA_DEPLOYMENT_TOKEN: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          token="$SWA_DEPLOYMENT_TOKEN"
          if [[ -z "$token" ]]; then
            token=$(az staticwebapp secrets list --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$AZURE_RESOURCE_GROUP" --name "$STATIC_SITE_NAME" --query properties.apiKey --output tsv)
          fi
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Publish Angular
        if: inputs.apply
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: artifacts/web
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true
          production_branch: ${{ github.ref_name }}
      - name: Verify deployed endpoints
        if: inputs.apply && inputs.deploy_backend
        env:
          API_URL: ${{ steps.infrastructure.outputs.function_url }}
          WEB_URL: ${{ steps.infrastructure.outputs.web_url }}
          SQL_ENABLED: ${{ steps.infrastructure.outputs.sql_enabled }}
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [[ "$DEPLOY_ENVIRONMENT" == 'dev' && "$SQL_ENABLED" == 'true' ]]; then
            extra+=(--development-database)
          fi
          python3 scripts/cloud-smoke.py --api-base-url "$API_URL/api" --web-base-url "$WEB_URL" --revision "$GITHUB_SHA" "${extra[@]}"
      - name: Verify deployed frontend
        if: inputs.apply && !inputs.deploy_backend
        env:
          API_URL: ${{ steps.infrastructure.outputs.function_url }}
          WEB_URL: ${{ steps.infrastructure.outputs.web_url }}
        run: python3 scripts/cloud-smoke.py --api-base-url "$API_URL/api" --web-base-url "$WEB_URL" --revision "$GITHUB_SHA" --frontend-only
      - name: Import explicitly requested demo history
        if: inputs.apply && inputs.deploy_backend && inputs.environment == 'dev' && inputs.import_demo_history
        env:
          VACATE_SQL_CONNECTION: ${{ secrets[format('AZURE_SQL_MIGRATION_CONNECTION_{0}', inputs.environment)] }}
          SQL_ENABLED: ${{ steps.infrastructure.outputs.sql_enabled }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SQL_ENABLED" = 'true'
          test -n "$VACATE_SQL_CONNECTION"
          dotnet artifacts/database/Vacate.Database.dll seed-fictional-history
          printf 'Explicit fictional history import completed for the dev database.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Deployment summary
        if: inputs.apply
        env:
          API_URL: ${{ steps.infrastructure.outputs.function_url }}
          WEB_URL: ${{ steps.infrastructure.outputs.web_url }}
          DEPLOY_BACKEND: ${{ inputs.deploy_backend }}
        run: |
          printf 'Deployed frontend `%s` to `%s`\n\nWeb: %s\n\nDemo login: %s/login.html\n' "$GITHUB_SHA" "$DEPLOY_ENVIRONMENT" "$WEB_URL" "$WEB_URL" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$DEPLOY_BACKEND" == 'true' ]]; then
            printf '\nBackend: deployed and checked at the same revision\n\nAPI health: %s/api/health\n' "$API_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '\nBackend: build/tests/publish and API smoke skipped; existing API version retained\n' >> "$GITHUB_STEP_SUMMARY"
          fi
