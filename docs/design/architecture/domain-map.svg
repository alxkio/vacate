<text xml:space="preserve" x="810" y="500" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#61717b">Leave-specific settings</text>
<text xml:space="preserve" x="810" y="530" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#61717b">remain owned by Leave</text>
<rect x="1158" y="332" width="354" height="285" rx="16" fill="white" stroke="#dce4e6" stroke-width="2"/>
<text xml:space="preserve" x="1180" y="369" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#12675e">Personal account</text>
<text xml:space="preserve" x="1180" y="410" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#61717b">Own profile</text>
<text xml:space="preserve" x="1180" y="440" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#61717b">Display preferences</text>
<text xml:space="preserve" x="1180" y="470" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#61717b">Target owner: profile/</text>
