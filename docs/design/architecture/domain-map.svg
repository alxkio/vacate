<text xml:space="preserve" x="440" y="470" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#61717b">Owns membership editing</text>
<text xml:space="preserve" x="440" y="500" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#61717b">Target: extract editor</text>
<text xml:space="preserve" x="440" y="530" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#61717b">from Organizations</text>
