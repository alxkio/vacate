<text xml:space="preserve" x="1180" y="530" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#61717b">to technical Core</text>
<text xml:space="preserve" x="48" y="666" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#12675e">02  COMPOSITION SURFACES · NOT UNIVERSAL BUSINESS OWNERS</text>
