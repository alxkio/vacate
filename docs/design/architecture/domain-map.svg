<text xml:space="preserve" x="1120" y="767" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#1d3038">Shell &amp; navigation</text>
<text xml:space="preserve" x="48" y="854" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#805615">03  FUTURE CANDIDATES · NOT APPROVED IMPLEMENTATION</text>
<rect x="48" y="877" width="475" height="199" rx="16" fill="#fffaf0" stroke="#d4b77e" stroke-width="2" stroke-dasharray="8 6"/>
<text xml:space="preserve" x="70" y="914" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#805615">Time tracking / time sheets</text>
<text xml:space="preserve" x="70" y="955" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#61717b">Recorded work and period workflows</text>
<text xml:space="preserve" x="70" y="985" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#61717b">Units, correction and approval</text>
<text xml:space="preserve" x="70" y="1015" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#61717b">semantics still need agreement</text>
<rect x="542" y="877" width="475" height="199" rx="16" fill="#fffaf0" stroke="#d4b77e" stroke-width="2" stroke-dasharray="8 6"/>
<text xml:space="preserve" x="564" y="914" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#805615">Attendance / presence</text>
<text xml:space="preserve" x="564" y="955" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#61717b">Meaning remains OPEN QUESTION:</text>
<text xml:space="preserve" x="564" y="985" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#61717b">planned presence or actual records?</text>
<text xml:space="preserve" x="564" y="1015" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#61717b">No leave ≠ proof of presence</text>
<rect x="1036" y="877" width="476" height="199" rx="16" fill="#fffaf0" stroke="#d4b77e" stroke-width="2" stroke-dasharray="8 6"/>
<text xml:space="preserve" x="1058" y="914" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#805615">Work locations</text>
<text xml:space="preserve" x="1058" y="955" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#61717b">Planned or recorded location</text>
<text xml:space="preserve" x="1058" y="985" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#61717b">Office / remote / other</text>
<text xml:space="preserve" x="1058" y="1015" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#61717b">Workflow and scope still open</text>
<text xml:space="preserve" x="48" y="1127" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="400" fill="#1d3038">Auth UI + Core session/HTTP support every capability. Business authorization stays on the server.</text>
<text xml:space="preserve" x="48" y="1180" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#61717b">Source: ADR-0005 · VAC-37 | Accepted target structure; future capabilities remain candidates.</text>
