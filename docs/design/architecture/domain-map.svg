<text xml:space="preserve" x="70" y="410" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#61717b">Requests &amp; history previews</text>
<text xml:space="preserve" x="70" y="440" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#61717b">Balances &amp; eligibility views</text>
<text xml:space="preserve" x="70" y="470" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#61717b">Approval configuration</text>
