<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1220" viewBox="0 0 1560 1220" role="img" aria-labelledby="title desc">
<title id="title">Domain &amp; subdomain map</title><desc id="desc">Candidate Vacate domain map: leave, people, organization and personal account capabilities; composition surfaces and future time-related candidates are separate. Leave transactions and future products are not implemented.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#12675e"/></marker></defs>
<rect x="0" y="0" width="1560" height="1220" rx="0" fill="#f4f7f7" stroke="#f4f7f7" stroke-width="2"/>
<text xml:space="preserve" x="48" y="48" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#12675e">vacate. / ARCHITECTURE</text>
<rect x="1230" y="22" width="282" height="38" rx="19" fill="#fff4df" stroke="#e2c894" stroke-width="2"/>
<text xml:space="preserve" x="1250" y="47" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#805615">ACCEPTED · 05 NOV 2026</text>
<text xml:space="preserve" x="48" y="105" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700" fill="#1d3038">Domain &amp; subdomain map</text>
<text xml:space="preserve" x="48" y="145" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="400" fill="#61717b">Problem space → candidate software ownership. Screens and API resources do not define bounded contexts.</text>
<rect x="48" y="185" width="1464" height="82" rx="16" fill="#12675e" stroke="#12675e" stroke-width="2"/>
<text xml:space="preserve" x="76" y="220" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="white">VACATE / Workforce coordination</text>
<text xml:space="preserve" x="76" y="249" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="400" fill="#d8eee8">Candidate business domain framing · exact bounded contexts remain subject to workflow evidence</text>
<text xml:space="preserve" x="48" y="310" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#12675e">01  CAPABILITIES WITH EXISTING IMPLEMENTATIONS</text>
<rect x="48" y="332" width="354" height="285" rx="16" fill="white" stroke="#dce4e6" stroke-width="2"/>
