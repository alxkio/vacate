<text xml:space="preserve" x="1250" y="47" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#805615">ACCEPTED · 05 NOV 2026</text>
<text xml:space="preserve" x="48" y="105" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700" fill="#1d3038">Angular architecture matrix</text>
<text xml:space="preserve" x="48" y="145" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="400" fill="#61717b">Each capability owns its journeys, presentation and data. Shared code stays deliberately small.</text>
