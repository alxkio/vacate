<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1150" viewBox="0 0 1560 1150" role="img" aria-labelledby="title desc">
<title id="title">Angular architecture matrix</title><desc id="desc">Accepted target matrix of Leave, People, Organization and Profile capabilities with journey, presentation, data access and utility responsibilities. Composition uses public APIs, Core and Shared do not depend on features.</desc>
