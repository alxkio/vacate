components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque API session token returned by POST /auth/sessions.
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: Public user GUID. Numeric storage IDs are not accepted.
      schema:
        type: string
        format: uuid
    OrganizationId:
      name: organizationId
      in: path
      required: true
      description: Public organization GUID. Numeric storage IDs are not accepted.
      schema:
        type: string
        format: uuid
    TeamId:
      name: teamId
      in: path
      required: true
      description: Public team GUID.
      schema:
        type: string
        format: uuid
    DepartmentId:
      name: departmentId
      in: path
      required: true
      description: Public department GUID.
      schema:
        type: string
        format: uuid
  requestBodies:
    EmptyObject:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
  responses:
    JsonData:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonData'
    Created:
      description: Resource created. The response includes a Location header.
      headers:
        Location:
          description: Relative URI of the created resource.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonData'
    NoContent:
      description: Operation succeeded without a response body.
    BadRequest:
      description: Invalid JSON, unsupported fields, or domain validation failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid, expired or revoked session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The current account is not authorized for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource is unavailable, deleted, or outside the caller's authorized scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The operation conflicts with current resource or lifecycle state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Request body exceeds 32 KiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: A JSON request must use application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    JsonData:
      description: API resource projection; shape depends on the operation.
      oneOf:
        - type: object
          additionalProperties: true
        - type: array
          items:
            type: object
            additionalProperties: true
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [healthy]
        version:
          type: string
    SessionCredentials:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    Session:
      type: object
      required: [accessToken, expiresAt]
      properties:
        accessToken:
          type: string
          description: Opaque bearer token with a 30-minute absolute lifetime; retain privately and do not log.
        expiresAt:
          type: string
          format: date-time
          description: Server UTC expiry, exactly 30 minutes after issuance. Activity does not renew it.
    UserCreate:
      type: object
      required: [username, firstName, lastName]
      additionalProperties: false
      properties:
        username:
          type: string
        firstName:
          type: string
        middleName:
          type: string
          nullable: true
        lastName:
          type: string
        gender:
          type: string
        married:
          type: boolean
        dependentChildren:
          type: integer
          minimum: 0
        soleCare:
          type: boolean
        companyId:
          type: string
          format: uuid
          nullable: true
    ProfilePatch:
      type: object
      additionalProperties: false
      properties:
        firstName:
          type: string
        middleName:
          type: string
          nullable: true
        lastName:
          type: string
        gender:
          type: string
        married:
          type: boolean
          nullable: true
        dependentChildren:
          type: integer
          minimum: 0
          nullable: true
        soleCare:
          type: boolean
          nullable: true
    AccountPatch:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
        status:
          type: string
          enum: [active, disabled]
    OrganizationWrite:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        workWeekDays:
          type: integer
          minimum: 1
          maximum: 7
    MembershipWrite:
      type: object
      additionalProperties: false
      properties:
        systemRoleId:
          type: string
          format: uuid
        jobRoleId:
          type: string
          format: uuid
        departmentId:
          type: string
          format: uuid
          nullable: true
        teamId:
          type: string
          format: uuid
          nullable: true
        managerUserId:
          type: string
          format: uuid
          nullable: true
        hireDate:
          type: string
          format: date
          nullable: true
        employmentEndDate:
          type: string
          format: date
          nullable: true
        priorService:
          type: number
          minimum: 0
          nullable: true
        workScheduleId:
          type: string
          format: uuid
          nullable: true
        holidayCalendarId:
          type: string
          format: uuid
          nullable: true
        leavePolicyId:
          type: string
          format: uuid
          nullable: true
        customAllocation:
          type: number
          minimum: 0
          nullable: true
    OrganizationPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        timeZone:
          type: string
          default: UTC
          description: Organization timezone for server today/past decisions; display conversion is unchanged.
        countryCode:
          type: string
          nullable: true
          pattern: '^[A-Z]{2}$'
        workWeekDays:
          type: integer
          enum: [5, 6]
        requireVacationApproval:
          type: boolean
        departmentLeadSettingsEnabled:
          type: boolean
        teamLeadSettingsEnabled:
          type: boolean
        carryoverEnabled:
          type: boolean
        carryoverYears:
          type: integer
          minimum: 0
          description: Saved configuration only; zero means unlimited years. No carryover processing.
    TeamCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
        departmentId:
          type: string
          format: uuid
          nullable: true
    TeamPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        departmentId:
          type: string
          format: uuid
          nullable: true
        requireVacationApproval:
          type: boolean
          nullable: true
          description: Null inherits; team overrides department, then organization. Delegated leads may change only this field.

    DepartmentCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
    DepartmentPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string

        requireVacationApproval:
          type: boolean
          nullable: true
          description: Null inherits; team overrides department, then organization. Delegated leads may change only this field.

    LeaveDraft:
      type: object
      additionalProperties: false
      required: [leaveTypeId, unit, mode, startDate]
      properties:
        leaveTypeId:
          type: string
        unit:
          type: string
          enum: [days, hours]
          description: Hours are rejected for submission in this release.
        mode:
          type: string
          enum: [duration, range]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        duration:
          type: integer
          minimum: 1
          nullable: true
    LeaveSubmission:
      type: object
      additionalProperties: false
      required: [leaveTypeId, unit, mode, startDate, idempotencyKey]
      properties:
        leaveTypeId:
          type: string
        unit:
          type: string
          enum: [days, hours]
        mode:
          type: string
          enum: [duration, range]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        duration:
          type: integer
          minimum: 1
          nullable: true
        previewFingerprint:
          type: string
          description: Previous preview digest; stale values return 409 for reconfirmation.
        idempotencyKey:
          type: string
          format: uuid
    LeavePreview:
      type: object
      required: [workingDates, excludedDates, coveredDates, newDates, amount, balances, warnings, errors, canSubmit, fingerprint]
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        workingDates:
          type: array
          items: {type: string, format: date}
        excludedDates:
          type: array
          items:
            type: object
            required: [date, reason]
            properties:
              date: {type: string, format: date}
              reason: {type: string}
        coveredDates:
          type: array
          items: {type: string, format: date}
        newDates:
          type: array
          items: {type: string, format: date}
        amount: {type: integer, minimum: 0}
        balances:
          type: array
          items:
            type: object
            required: [leaveTypeId, year, allocation, used, pending, available, requested, projected]
            properties:
              leaveTypeId: {type: string}
              year: {type: integer}
              allocation: {type: number}
              used: {type: number}
              pending: {type: number}
              available: {type: number}
              requested: {type: number}
              projected: {type: number}
        warnings:
          type: array
          items: {type: string}
        errors:
          type: array
          items: {type: string}
        canSubmit: {type: boolean}
        fingerprint: {type: string}
    LeaveRequest:
      type: object
      required: [guid, leaveTypeId, createdAt, dates]
      properties:
        guid: {type: string, format: uuid}
        leaveTypeId: {type: string}
        createdAt: {type: string, format: date-time}
        approverGuid: {type: string, format: uuid, nullable: true}
        decidedAt: {type: string, format: date-time, nullable: true}
        source: {type: string, enum: [EmployeeRequest, CompanyClosure]}
        closureGuid: {type: string, format: uuid, nullable: true}
        updatedAt: {type: string, format: date-time, nullable: true}
        dates:
          type: array
          items:
            type: object
            required: [date, status, entitlementYear]
            properties:
              date: {type: string, format: date}
              status: {type: string, enum: [Approved, Pending, Declined]}
              entitlementYear: {type: integer}
    LeaveRequestList:
      type: array
      items:
        $ref: '#/components/schemas/LeaveRequest'
    LeaveSubmissionResult:
      type: object
      required: [outcome, request, preview]
      properties:
        outcome: {type: string, enum: [created, already-covered]}
        request:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LeaveRequest'
        preview:
          $ref: '#/components/schemas/LeavePreview'

    LeaveCalendarList:
      type: array
      items:
        type: object
        required: [requestGuid, leaveTypeId, date, status]
        properties:
          requestGuid: {type: string, format: uuid}
          leaveTypeId: {type: string}
          date: {type: string, format: date}
          status: {type: string, enum: [Approved, Pending]}

    CompanyHolidayInput:
      type: object
      additionalProperties: false
      required: [name, month, day]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        month: {type: integer, minimum: 1, maximum: 12}
        day: {type: integer, minimum: 1, maximum: 31}
    ApproverInput:
      type: object
      additionalProperties: false
      required: [scope, scopeGuid]
      properties:
        scope: {type: string, enum: [organization, department, team]}
        scopeGuid: {type: string, format: uuid}
        approverGuid: {type: string, format: uuid, nullable: true}
    ClosureDraft:
      type: object
      additionalProperties: false
      required: [name, startDate, endDate, deductAnnualLeave]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        deductAnnualLeave: {type: boolean}
    ClosurePublication:
      type: object
      additionalProperties: false
      required: [name, startDate, endDate, deductAnnualLeave, idempotencyKey]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
