openapi: 3.0.3
info:
  title: Vacate API
  version: 1.0.0
  description: >-
    OpenAPI description of the .NET 10 Azure Functions isolated-worker API.
    Local development credentials and fictional seed data are not production authentication.
servers:
  - url: /api
    description: Azure Functions route prefix
tags:
  - name: Health
  - name: Sessions
  - name: Users
  - name: Organizations
  - name: Memberships
  - name: Teams
  - name: Departments
  - name: Leave
paths:
  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Check API liveness
      security: []
      responses:
        '200':
          description: The API host is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /auth/sessions:
    post:
      operationId: createSession
      tags: [Sessions]
      summary: Sign in with an enabled development account
      description: Development credentials are fictional and must not be used for production authentication.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCredentials'
      responses:
        '200':
          description: Session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /auth/sessions/current:
    get:
      operationId: getCurrentSession
      tags: [Sessions]
      summary: Get the current session profile
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/JsonData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCurrentSession
      tags: [Sessions]
      summary: Revoke the current session
      security:
        - bearerAuth: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users:
    get:
      operationId: listUsers
      tags: [Users]
      summary: List users visible to the current account
      description: Company-scoped directory with public GUID and nullable department/team GUIDs and names; excludes private membership, family and leave fields.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/JsonData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createUser
      tags: [Users]
      summary: Create an unassigned account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getUser
      tags: [Users]
      summary: Get an own profile or an authorized colleague projection
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/JsonData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateUser
      tags: [Users]
      summary: Update the current account's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
      responses:
        '200':
          $ref: '#/components/responses/JsonData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    delete:
      operationId: deleteUser
      tags: [Users]
      summary: Soft-delete an account
      security:
        - bearerAuth: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/{userId}/account:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      operationId: updateUserAccount
      tags: [Users]
      summary: Update an account username or status (administrator only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatch'
      responses:
        '200':
          $ref: '#/components/responses/JsonData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /users/{userId}/deletion-request:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: requestUserDeletion
      tags: [Users]
      summary: Record an account deletion request without deleting the account
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/EmptyObject'
      responses:
        '200':
          $ref: '#/components/responses/JsonData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /organizations:
    get:
      operationId: listOrganizations
