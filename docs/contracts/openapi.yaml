  /organizations/{organizationId}/summary:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      operationId: getOrganizationSummary
      tags: [Organizations]
      summary: Get the current member's organization summary
      description: >-
        Returns id, guid, name, workWeekDays, departmentName, teamName and teamMembers.
        teamMembers contains the current member and colleagues assigned to the same team
        in this organization, or an empty array when no team is assigned. Each item uses
        the directory allowlist (username, email, firstName, middleName, lastName, gender,
        jobTitle, systemRole, guid, departmentId, departmentName, teamId, teamName);
        unassigned structure is null. It never includes membership balances or family fields.
        Membership is not evidence of team administration or approval rights.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/JsonData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
